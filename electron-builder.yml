appId: dev.luma.ide
productName: Luma
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  executableName: Luma
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luma
electronDownload:
  mirror: https://github.com/electron/electron/releases/download/
npmRebuild: true
asar: true
asarUnpack:
  - node_modules/node-pty/**
