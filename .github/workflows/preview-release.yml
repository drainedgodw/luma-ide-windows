name: Publish Windows preview

on:
  push:
    branches: [feat/windows-foundation]
    paths:
      - .github/workflows/preview-release.yml
      - src/**
      - native/**
      - scripts/**
      - tests/**
      - build/**
      - package.json
      - package-lock.json
      - update.json
      - CHANGELOG.md
      - electron-builder.yml
      - THIRD_PARTY_NOTICES.md
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: windows-preview-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      npm_config_msvs_version: '2022'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure Python for node-gyp
        shell: pwsh
        run: |
          "npm_config_python=$env:pythonLocation\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: npm ci
      - name: Build neutral DWM blur helper
        shell: pwsh
        run: ./scripts/build-native-blur.ps1
      - name: Validate source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd /c "npm run check > validation.log 2>&1"
          $status = $LASTEXITCODE
          Get-Content validation.log
          if ($status -ne 0) {
            $tail = (Get-Content validation.log -Tail 200) -join "`n"
            $body = "## Neutral panel blur CI validation failure`n`nCommit: $env:GITHUB_SHA`n`n$tail"
            $body | Set-Content ci-comment.md -Encoding utf8
            gh pr comment 1 --body-file ci-comment.md --repo $env:GITHUB_REPOSITORY
            exit $status
          }
      - name: Verify neutral panel-only blur architecture
        shell: pwsh
        run: |
          $main = 'src/main/index.ts'
          $controller = 'src/main/nativePanelBlurController.ts'
          $helper = 'native/windows-blur/luma-native-blur.cpp'
          foreach ($file in @($main, $controller)) {
            if (-not (Select-String -Path $file -SimpleMatch "backgroundMaterial: 'none'" -Quiet)) { throw "Native material must stay disabled in $file" }
            if (Select-String -Path $file -SimpleMatch "backgroundMaterial: 'acrylic'" -Quiet) { throw "Tinted Acrylic is forbidden in $file" }
          }
          foreach ($pattern in @('layer.setShape(shape)', 'layer.setIgnoreMouseEvents(true)', 'moveAbove')) {
            if (-not (Select-String -Path $controller -SimpleMatch $pattern -Quiet)) { throw "Missing native panel layer invariant: $pattern" }
          }
          if (-not (Select-String -Path $helper -SimpleMatch 'EnableBlurBehind = 3' -Quiet)) { throw 'Neutral DWM blur state is missing.' }
          if (Select-String -Path $helper -SimpleMatch 'EnableAcrylicBlurBehind' -Quiet) { throw 'Tinted Acrylic must not be compiled into the helper.' }
          if (-not (Test-Path 'vendor/native/Luma.NativeBlur.exe' -PathType Leaf)) { throw 'Native blur helper was not built.' }
      - name: Verify Stack winget package IDs when available
        shell: pwsh
        run: |
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if (-not $winget) {
            Write-Warning 'winget is not present on the Windows Server runner; command plans remain covered by unit tests.'
            exit 0
          }
          $ids = @(
            'OpenJS.NodeJS.LTS',
            'Python.Python.3.12',
            'Rustlang.Rustup',
            'GoLang.Go',
            'EclipseAdoptium.Temurin.21.JDK',
            'Apache.Maven',
            'Microsoft.DotNet.SDK.8',
            'LLVM.LLVM',
            'Kitware.CMake',
            'Unity.UnityHub',
            'EpicGames.EpicGamesLauncher'
          )
          foreach ($id in $ids) {
            & $winget.Source show --id $id --exact --source winget --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw "Unknown winget package ID: $id" }
          }
      - name: Build application
        run: npm run build
      - name: Fetch verified MinGit runtime
        shell: pwsh
        run: ./scripts/fetch-mingit.ps1
      - name: Fetch verified Node.js runtime
        shell: pwsh
        run: ./scripts/fetch-node-runtime.ps1
      - name: Package Windows x64
        run: npx electron-builder --win --x64 --publish never
      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $requiredFiles = @(
            'dist/win-unpacked/Luma.exe',
            'dist/win-unpacked/resources/app.asar',
            'dist/win-unpacked/resources/git/cmd/git.exe',
            'dist/win-unpacked/resources/node/node.exe',
            'dist/win-unpacked/resources/node/node_modules/npm/bin/npm-cli.js',
            'dist/win-unpacked/resources/native/Luma.NativeBlur.exe',
            'dist/win-unpacked/resources/THIRD_PARTY_NOTICES.md'
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing packaged runtime file: $file" }
          }
          $nodePtyBinaries = @(Get-ChildItem 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/node-pty' -Filter '*.node' -File -Recurse)
          if ($nodePtyBinaries.Count -eq 0) { throw 'The packaged node-pty native binary is missing.' }
          & 'dist/win-unpacked/resources/git/cmd/git.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged MinGit executable failed its version check.' }
          & 'dist/win-unpacked/resources/node/node.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged Node.js executable failed its version check.' }
          & 'dist/win-unpacked/resources/node/node_modules/npm/bin/npm-cli.js' --version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged npm CLI failed its version check.' }
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $packages = @(Get-ChildItem dist -Filter '*.exe' -File)
          $installers = @($packages | Where-Object { $_.Name -match 'Setup' })
          $portablePackages = @($packages | Where-Object { $_.Name -notmatch 'Setup' })
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count): $($packages.Name -join ', ')" }
          if ($portablePackages.Count -ne 1) { throw "Expected one portable executable, found $($portablePackages.Count): $($packages.Name -join ', ')" }
          Copy-Item $installers[0].FullName 'release/Luma-Windows-Setup-x64.exe'
          Copy-Item $portablePackages[0].FullName 'release/Luma-Windows-Portable-x64.exe'
          $releaseFiles = @(Get-Item 'release/Luma-Windows-Setup-x64.exe'; Get-Item 'release/Luma-Windows-Portable-x64.exe')
          $checksums = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content 'release/SHA256SUMS.txt' -Encoding ascii
          @"
          # Luma 0.4.1 — Neutral Panel Blur (Windows Preview)

          Self-contained Windows 10/11 x64 preview built from commit $env:GITHUB_SHA.

          The gray result in 0.4.0 came from Electron's built-in Acrylic tint. Version 0.4.1 removes Acrylic from both Electron windows. A packaged native helper now asks Windows DWM for live ACCENT_ENABLE_BLURBEHIND composition with a zero tint color.

          The main Luma window remains genuinely transparent. The separate focusless and click-through blur layer is clipped to the rounded header, sidebar, top-level view panel, welcome surface and terminal; it does not cover the spaces between those panels or the whole application.

          The 0–64 Panel blur slider linearly blends the neutral blurred layer: zero removes it, 32 is 50% and 64 is full intensity. Panel regions are re-measured after layout, resize, transitions and workspace/view replacement. Background updates cannot move Luma above the currently focused application.

          Luma never reads, captures, copies, caches or renders the desktop wallpaper. Interactive Windows verification is still required for the exact visual result, workspace switching, focus, movement, resize, maximize/minimize and DPI behavior.

          Stack retains allowlisted install/remove actions for every framework and library shown in the current catalog. Workspace Trust is required and commands remain fixed in the main process with shell execution disabled.

          The installer includes Electron, application files, production dependencies, native node-pty, the DWM blur helper, verified MinGit 2.55.0.5 and verified Node/npm. This preview is unsigned and may trigger Microsoft Defender SmartScreen.
          "@ | Set-Content 'release-notes.md' -Encoding utf8
      - name: Publish rolling preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-preview'
          $title = 'Luma 0.4.1 — Neutral Panel Blur (Windows Preview)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force
          $assets = @('release/Luma-Windows-Setup-x64.exe', 'release/Luma-Windows-Portable-x64.exe', 'release/SHA256SUMS.txt')
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload preview release assets.' }
            gh release edit $tag --title $title --notes-file release-notes.md --prerelease --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the preview release.' }
          } else {
            gh release create $tag @assets --verify-tag --title $title --notes-file release-notes.md --prerelease --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the preview release.' }
          }
