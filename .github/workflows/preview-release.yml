name: Windows Preview Release

on:
  push:
    branches:
      - feat/windows-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-preview-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm install --no-save --ignore-scripts node-pty@1.1.0
          npm install --no-save --ignore-scripts @rollup/rollup-win32-x64-msvc@4.53.5
          npm install --no-save --ignore-scripts @esbuild/win32-x64@0.25.12
          npm rebuild node-pty --build-from-source

      - name: Verify native shell
        shell: pwsh
        run: node scripts/verify-node-pty.mjs

      - name: Verify Stack catalog and actions
        shell: pwsh
        run: |
          npm run typecheck
          npm run test:run

      - name: Verify panel-only native blur architecture
        shell: pwsh
        run: |
          if (-not (Select-String -Path 'src/main/index.ts' -Pattern "backgroundMaterial: 'none'" -Quiet)) { throw 'Main window must keep native material disabled' }
          if (Select-String -Path 'src/main/index.ts' -Pattern "backgroundMaterial: 'acrylic'" -Quiet) { throw 'Acrylic must never be applied to the main window' }
          foreach ($pattern in @("backgroundMaterial: 'acrylic'", 'setShape\(shape\)', 'setIgnoreMouseEvents\(true\)', 'moveAbove')) {
            if (-not (Select-String -Path 'src/main/nativePanelBlurController.ts' -Pattern $pattern -Quiet)) { throw "Missing native panel layer invariant: $pattern" }
          }

      - name: Build renderer and main process
        shell: pwsh
        run: npm run build

      - name: Fetch pinned Windows runtimes
        shell: pwsh
        run: node scripts/fetch-windows-runtimes.mjs

      - name: Build NSIS and portable packages
        shell: pwsh
        run: npm run dist:win

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          & 'dist/win-unpacked/resources/git/cmd/git.exe' --version
          & 'dist/win-unpacked/resources/node/node.exe' --version
          & 'dist/win-unpacked/resources/node/node.exe' 'dist/win-unpacked/resources/node/node_modules/npm/bin/npm-cli.js' --version
          $env:ELECTRON_RUN_AS_NODE = '1'
          & 'dist/win-unpacked/Luma.exe' 'scripts/verify-packaged-stack.cjs'
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          $asarListing = npx asar list 'dist/win-unpacked/resources/app.asar'
          if (-not ($asarListing -match 'out\\main\\stackManifestPreparation\.js')) { throw 'Stack manifest helper is missing from packaged app.asar' }
          if (-not ($asarListing -match 'out\\main\\completeStackTools\.js')) { throw 'Complete Stack helper is missing from packaged app.asar' }
          if (-not ($asarListing -match 'out\\main\\nativePanelBlurController\.js')) { throw 'Native panel blur controller is missing from packaged app.asar' }
          $unpacked = Resolve-Path 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/node-pty'
          if (-not (Test-Path "$unpacked/build/Release/pty.node")) { throw 'pty.node is missing' }
          if (-not (Test-Path 'dist/win-unpacked/resources/git/cmd/git.exe')) { throw 'MinGit is missing' }
          if (-not (Test-Path 'dist/win-unpacked/resources/node/node.exe')) { throw 'Node.js is missing' }
          if (-not (Test-Path 'dist/win-unpacked/resources/node/node_modules/npm/bin/npm-cli.js')) { throw 'npm is missing' }

      - name: Generate checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*Setup*x64.exe' | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter '*Portable*x64.exe' | Select-Object -First 1
          if (-not $installer -or -not $portable) { throw 'Expected Windows packages were not produced.' }
          $lines = @(
            "$( (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() )  $($installer.Name)",
            "$( (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower() )  $($portable.Name)"
          )
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines

      - name: Publish rolling preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-preview
          name: Luma 0.4.0 — Native Panel Blur (Windows Preview)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Windows x64 preview for Luma 0.4.0.

            This build keeps the main application window genuinely transparent and applies native Acrylic only through a separate click-through window clipped to the rounded header, sidebar, top-level view panels and terminal. The 0–64 slider changes both panel CSS blur and the native layer's visible intensity; zero removes it. Workspace/view changes re-measure the regions instead of leaving a full-window material behind. No wallpaper is read, copied or rendered.

            The native multi-window composition still needs interactive Windows verification for z-order, focus, movement, resize, maximize/minimize and DPI behavior before the draft PR is considered complete.

            Download **Luma-Windows-Setup-x64.exe** for the normal installer or **Luma-Windows-Portable-x64.exe** for the portable build. This preview is unsigned, so Windows SmartScreen may show a warning.
          files: |
            dist/*Setup*x64.exe
            dist/*Portable*x64.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
