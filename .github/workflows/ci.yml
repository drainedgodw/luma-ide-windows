name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object -FilePath ci-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Type-check
        shell: pwsh
        run: |
          npm run typecheck 2>&1 | Tee-Object -FilePath ci-typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath ci-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build application
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath ci-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows x64
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath ci-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: luma-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
          retention-days: 7
      - name: Report failure details
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const logs = [
              ['install', 'ci-install.log'],
              ['typecheck', 'ci-typecheck.log'],
              ['tests', 'ci-tests.log'],
              ['build', 'ci-build.log'],
              ['package', 'ci-package.log'],
            ];
            const sections = [];
            for (const [name, path] of logs) {
              if (!fs.existsSync(path)) continue;
              const tail = fs.readFileSync(path, 'utf8').split(/\r?\n/).slice(-80).join('\n');
              sections.push(`### ${name}\n\`\`\`text\n${tail.replaceAll('```', '` ` `')}\n\`\`\``);
            }
            const body = [
              '## Windows CI failure',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ...sections,
            ].join('\n\n').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
