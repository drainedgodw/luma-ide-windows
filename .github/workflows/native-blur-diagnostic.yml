name: Diagnose native blur helper

on:
  push:
    branches: [feat/windows-foundation]
    paths:
      - .github/workflows/native-blur-diagnostic.yml
      - native/windows-blur/**
      - scripts/build-native-blur.ps1
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile helper
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-native-blur.ps1 2>&1 | Tee-Object -FilePath native-blur-build.log
          $status = $LASTEXITCODE
          exit $status
      - name: Report failure
        if: steps.compile.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail = (Get-Content native-blur-build.log -Tail 200) -join "`n"
          $body = "## Native blur helper build failure`n`nCommit: $env:GITHUB_SHA`n`n```text`n$tail`n```"
          $body | Set-Content ci-comment.md -Encoding utf8
          gh pr comment 1 --body-file ci-comment.md --repo $env:GITHUB_REPOSITORY
          exit 1
      - name: Verify executable
        if: steps.compile.outcome == 'success'
        shell: pwsh
        run: |
          if (-not (Test-Path 'vendor/native/Luma.NativeBlur.exe' -PathType Leaf)) { throw 'Native blur helper was not produced.' }
          Get-Item 'vendor/native/Luma.NativeBlur.exe' | Format-List Name,Length
