name: Diagnose native blur helper

on:
  push:
    branches: [feat/windows-foundation]
    paths:
      - .github/workflows/native-blur-diagnostic.yml
      - native/windows-blur/**
      - scripts/build-native-blur.ps1
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify helper
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-native-blur.ps1 *> native-blur-build.log
          $status = $LASTEXITCODE
          Get-Content native-blur-build.log
          if ($status -ne 0) {
            $tail = (Get-Content native-blur-build.log -Tail 200) -join "`n"
            $body = @(
              '## Native blur helper build failure',
              '',
              "Commit: $env:GITHUB_SHA",
              '',
              '```text',
              $tail,
              '```'
            ) -join "`n"
            $body | Set-Content ci-comment.md -Encoding utf8
            gh pr comment 1 --body-file ci-comment.md --repo $env:GITHUB_REPOSITORY
            exit $status
          }
          if (-not (Test-Path 'vendor/native/Luma.NativeBlur.exe' -PathType Leaf)) { throw 'Native blur helper was not produced.' }
          Get-Item 'vendor/native/Luma.NativeBlur.exe' | Format-List Name,Length
